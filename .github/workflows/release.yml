name: release
# main에 올라온 package.json 버전의 릴리스가 아직 없으면
# 윈도우 설치파일을 만들어 GitHub Releases(v버전)에 올린다.
# 설치된 프로그램은 여기서 새 버전을 찾아 자동 업데이트한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: 이미 나간 버전인지 확인
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$V 는 이미 릴리스됨 — 건너뜀"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.ver.outputs.skip == 'false'
        run: npm ci
      - if: steps.ver.outputs.skip == 'false'
        run: npm test
      - name: 버전 태그 만들기
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          T="v${{ steps.ver.outputs.version }}"
          git fetch --tags --force
          if ! git rev-parse "$T" >/dev/null 2>&1; then
            git tag "$T" && git push origin "$T"
          fi
      - name: Build & publish
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          set -o pipefail
          set +e
          npx electron-builder --win --x64 --publish always 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -iE "publish|upload|error|warn|skipp|exists" build.log | tail -n 30 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::$l"; done
          ls -la dist | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::dist $l"; done
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
